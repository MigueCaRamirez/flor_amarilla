<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para ti</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sky" aria-hidden="true">
    <div class="sun-glow"></div>
    <div class="field"></div>
    <div class="particles" id="particles"></div>
  </div>

  <div class="butterflies" id="butterflies" aria-hidden="true"></div>

  <main class="scene">
    <p class="dedication">Para ti</p>

    <div class="gift">
      <div class="portrait" aria-hidden="true">
        <div class="portrait-hair hair-back"></div>
        <div class="portrait-neck"></div>
        <div class="portrait-shoulders"></div>
        <div class="portrait-top">
          <div class="top-trim"></div>
        </div>
        <div class="portrait-face">
          <div class="blush blush-left"></div>
          <div class="blush blush-right"></div>
          <div class="freckles"></div>
        </div>
        <div class="portrait-hair hair-front">
          <span class="strand s1"></span>
          <span class="strand s2"></span>
          <span class="strand s3"></span>
          <span class="strand s4"></span>
          <span class="strand s5"></span>
        </div>
      </div>

      <div class="flower" id="flower" aria-hidden="true" title="Tócame">
        <div class="stem"></div>
        <div class="leaf leaf-left"></div>
        <div class="leaf leaf-right"></div>
        <div class="bloom">
          <div class="petals petals-back" id="petals-back"></div>
          <div class="petals petals-front" id="petals-front"></div>
          <div class="center">
            <div class="center-rim"></div>
            <div class="center-seeds" id="center-seeds"></div>
            <div class="center-glow"></div>
          </div>
        </div>
      </div>
    </div>

    <p class="message">
      Un regalo para ti con todo mi cariño y amor
      para la niña de la que estoy más orgulloso en el mundo.
    </p>
  </main>

  <script src="script.js"></script>
</body>
</html>
