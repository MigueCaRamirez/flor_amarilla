<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para ti</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sky" aria-hidden="true">
    <div class="sun-glow"></div>
    <div class="field"></div>
  </div>

  <!-- Mariposas moradas (HTML/CSS — siempre visibles) -->
  <div class="butterflies" aria-hidden="true">
    <span class="bf bf-1"></span>
    <span class="bf bf-2"></span>
    <span class="bf bf-3"></span>
    <span class="bf bf-4"></span>
    <span class="bf bf-5"></span>
    <span class="bf bf-6"></span>
    <span class="bf bf-7"></span>
    <span class="bf bf-8"></span>
  </div>

  <main class="scene">
    <p class="dedication">Para ti</p>

    <div class="gift">
      <div class="portrait" id="portrait" aria-hidden="true">
        <svg class="portrait-svg" viewBox="0 0 240 300" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="hairShade" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#e87040"/>
              <stop offset="45%" stop-color="#c44722"/>
              <stop offset="100%" stop-color="#8a2a14"/>
            </linearGradient>
            <linearGradient id="hairDeep" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#b83a1c"/>
              <stop offset="100%" stop-color="#6e1f0e"/>
            </linearGradient>
            <linearGradient id="skinGrad" x1="0.3" y1="0" x2="0.7" y2="1">
              <stop offset="0%" stop-color="#f6d7c6"/>
              <stop offset="100%" stop-color="#ebc0a8"/>
            </linearGradient>
          </defs>

          <!-- Hair mass behind (volume like reference) -->
          <ellipse cx="120" cy="145" rx="92" ry="115" fill="url(#hairDeep)"/>
          <path d="M30 95 C18 160 28 230 55 275 L95 250 C70 200 60 145 68 100 Z" fill="#7a2412"/>
          <path d="M210 95 C222 160 212 230 185 275 L145 250 C170 200 180 145 172 100 Z" fill="#7a2412"/>

          <!-- White top -->
          <path d="M42 210 C80 188 160 188 198 210 L210 300 L30 300 Z" fill="#f8f5f1"/>
          <path d="M70 214 C100 200 140 200 170 214" fill="none" stroke="#ddd5cc" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="78" cy="212" r="2" fill="#fff" stroke="#e5ddd4" stroke-width="0.5"/>
          <circle cx="90" cy="207" r="2" fill="#fff" stroke="#e5ddd4" stroke-width="0.5"/>
          <circle cx="102" cy="204" r="2" fill="#fff" stroke="#e5ddd4" stroke-width="0.5"/>
          <circle cx="114" cy="202" r="2" fill="#fff" stroke="#e5ddd4" stroke-width="0.5"/>
          <circle cx="126" cy="202" r="2" fill="#fff" stroke="#e5ddd4" stroke-width="0.5"/>
          <circle cx="138" cy="204" r="2" fill="#fff" stroke="#e5ddd4" stroke-width="0.5"/>
          <circle cx="150" cy="207" r="2" fill="#fff" stroke="#e5ddd4" stroke-width="0.5"/>
          <circle cx="162" cy="212" r="2" fill="#fff" stroke="#e5ddd4" stroke-width="0.5"/>

          <!-- Neck -->
          <path d="M105 170 Q120 168 135 170 L138 215 Q120 222 102 215 Z" fill="#ebc0a8"/>

          <!-- Face — blank oval -->
          <ellipse cx="120" cy="118" rx="48" ry="56" fill="url(#skinGrad)"/>

          <!-- Soft blush only -->
          <ellipse cx="92" cy="132" rx="10" ry="6" fill="#e8a090" opacity="0.28"/>
          <ellipse cx="148" cy="132" rx="10" ry="6" fill="#e8a090" opacity="0.28"/>

          <!-- Crown / part (side part like reference) -->
          <path d="M72 78 C85 42 110 32 128 34 C155 38 175 58 178 88
                   C165 62 140 55 120 58 C95 55 78 65 72 78 Z" fill="url(#hairShade)"/>

          <!-- Side locks framing face (flowing, not triangles) -->
          <path d="M70 85 C55 130 48 175 58 230 C68 245 82 235 86 210
                   C90 170 92 130 95 100 C90 88 80 84 70 85 Z" fill="#d4552e"/>
          <path d="M170 85 C185 130 192 175 182 230 C172 245 158 235 154 210
                   C150 170 148 130 145 100 C150 88 160 84 170 85 Z" fill="#d4552e"/>

          <!-- Inner softer strands over shoulders -->
          <path d="M78 100 C70 150 72 195 88 235 C96 220 100 175 102 130
                   C100 110 88 102 78 100 Z" fill="#e06a3a"/>
          <path d="M162 100 C170 150 168 195 152 235 C144 220 140 175 138 130
                   C140 110 152 102 162 100 Z" fill="#e06a3a"/>

          <!-- Fine strand lines (illustration texture) -->
          <g fill="none" stroke="#8a2a14" stroke-width="0.7" opacity="0.35" stroke-linecap="round">
            <path d="M95 55 C90 90 88 130 92 170"/>
            <path d="M110 48 C108 95 106 140 110 185"/>
            <path d="M130 48 C132 95 134 140 130 185"/>
            <path d="M145 55 C150 90 152 130 148 170"/>
            <path d="M75 110 C68 150 70 190 80 220"/>
            <path d="M165 110 C172 150 170 190 160 220"/>
          </g>

          <!-- Soft bangs fall -->
          <path d="M88 70 C95 78 105 82 112 95 C108 78 98 72 88 70 Z" fill="#e87040" opacity="0.85"/>
          <path d="M152 70 C145 78 135 82 128 95 C132 78 142 72 152 70 Z" fill="#e87040" opacity="0.85"/>
        </svg>
      </div>

      <div class="flower" id="flower" aria-hidden="true" title="Tócame">
        <div class="stem"></div>
        <div class="leaf leaf-left"></div>
        <div class="leaf leaf-right"></div>
        <div class="bloom">
          <div class="petals petals-back" id="petals-back"></div>
          <div class="petals petals-front" id="petals-front"></div>
          <div class="center">
            <div class="center-rim"></div>
            <div class="center-seeds" id="center-seeds"></div>
            <div class="center-glow"></div>
          </div>
        </div>
      </div>
    </div>

    <p class="message" id="message">
      Un regalo para ti con todo mi cariño y amor
      para la niña de la que estoy más orgulloso en el mundo.
    </p>
  </main>

  <script src="script.js"></script>
</body>
</html>
