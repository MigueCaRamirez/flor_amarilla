<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para ti</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sky" aria-hidden="true">
    <div class="sun-glow"></div>
    <div class="field"></div>
  </div>

  <!-- Mariposas moradas (HTML/CSS — siempre visibles) -->
  <div class="butterflies" aria-hidden="true">
    <span class="bf bf-1"></span>
    <span class="bf bf-2"></span>
    <span class="bf bf-3"></span>
    <span class="bf bf-4"></span>
    <span class="bf bf-5"></span>
    <span class="bf bf-6"></span>
    <span class="bf bf-7"></span>
    <span class="bf bf-8"></span>
  </div>

  <main class="scene">
    <p class="dedication">Para ti</p>

    <div class="gift">
      <div class="portrait" id="portrait" aria-hidden="true">
        <div class="p-figure">
          <div class="p-hair"></div>
          <div class="p-body"></div>
          <div class="p-neck"></div>
          <div class="p-face"></div>
        </div>
      </div>

      <div class="flower" id="flower" aria-hidden="true" title="Tócame">
        <div class="stem"></div>
        <div class="leaf leaf-left"></div>
        <div class="leaf leaf-right"></div>
        <div class="bloom">
          <div class="petals petals-back" id="petals-back"></div>
          <div class="petals petals-front" id="petals-front"></div>
          <div class="center">
            <div class="center-rim"></div>
            <div class="center-seeds" id="center-seeds"></div>
            <div class="center-glow"></div>
          </div>
        </div>
      </div>
    </div>

    <p class="message" id="message">
      Un regalo para ti con todo mi cariño y amor
      para la niña de la que estoy más orgulloso en el mundo.
    </p>
  </main>

  <script src="script.js"></script>
</body>
</html>
