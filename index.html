<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para ti</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sky" aria-hidden="true">
    <div class="sun-glow"></div>
    <div class="field"></div>
    <div class="particles" id="particles"></div>
  </div>

  <main class="scene">
    <p class="dedication">Para ti</p>

    <div class="flower" aria-hidden="true">
      <div class="stem"></div>
      <div class="leaf leaf-left"></div>
      <div class="leaf leaf-right"></div>
      <div class="bloom">
        <div class="petals petals-back" id="petals-back"></div>
        <div class="petals petals-front" id="petals-front"></div>
        <div class="center">
          <div class="center-rim"></div>
          <div class="center-seeds" id="center-seeds"></div>
          <div class="center-glow"></div>
        </div>
      </div>
    </div>

    <p class="message">
      Feliz día. Un girasol como flor amarilla para ti.
      Sé que no es mucho, pero quería darte algo con todo mi cariño.
      Estoy orgulloso de ti, y espero que todo te salga bien.
    </p>
  </main>

  <script src="script.js"></script>
</body>
</html>
